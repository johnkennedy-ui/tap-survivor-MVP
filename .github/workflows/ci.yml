name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-secret-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Typecheck content tooling
        run: npm run typecheck:content

      - name: Check global usage
        run: npm run check:globals

      - name: Check formatting
        run: npm run format:check

      - name: Check format hygiene
        run: npm run check:format-hygiene

      - name: Check package ID
        run: npm run check:package-id

      - name: Build content
        run: npm run build:content

      - name: Validate content
        run: npm run validate:content

      - name: Run tests
        run: npm test

      - name: Run agent check
        run: npm run agent:check

      - name: Build shared web runtime
        run: npm run build:web

      - name: Check runtime parity
        run: npm run check:runtime-parity

      - name: Check commit evidence helper
        run: npm run check:commit-evidence -- --help

      - name: Check task scope helper
        run: npm run check:task-scope -- --help
