name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-secret-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Typecheck content tooling
        run: npm run typecheck:content

      - name: Check global usage
        run: npm run check:globals

      - name: Check formatting
        run: npm run format:check

      - name: Check format hygiene
        run: npm run check:format-hygiene

      - name: Check package ID
        run: npm run check:package-id

      - name: Build content
        run: npm run build:content

      - name: Validate content
        run: npm run validate:content

      # The full agent gate already executes npm test, including its pretest script.
      - name: Run agent check
        run: npm run agent:check -- --full

      - name: Build shared web runtime
        run: npm run build:web

      - name: Check runtime parity
        run: npm run check:runtime-parity

      - name: Smoke the built browser runtime
        run: npm run smoke:production-browser:docker:strict

      - name: Check commit evidence helper
        run: npm run check:commit-evidence -- --help

      - name: Check task scope helper
        run: npm run check:task-scope -- --help

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build unsigned debug APK
        run: npm run android:debug
