name: Publish Tap Survivor MVP

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tap-survivor-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run agent validation
        run: npm run agent:check

      - name: Build shared web runtime
        run: npm run build:web

      - name: Check runtime parity source
        run: npm run check:runtime-parity

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish shared www runtime to gh-pages
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -R www/. "$publish_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R "$publish_dir"/. .
          git add .
          git commit -m "Deploy Pages site for ${GITHUB_SHA}" || exit 0
          git push --force origin gh-pages
