name: Publish Tap Survivor MVP

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tap-survivor-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate prototype files
        run: node scripts/verify-mvp.mjs

      - name: Publish gh-pages branch
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp index.html "$publish_dir/"
          cp README.md AGENTS.md MVP_GAME_PLAN.md PHONE_TEST_PIPELINE.md package.json "$publish_dir/"
          cp -R assets content docs src scripts "$publish_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R "$publish_dir"/. .
          touch .nojekyll
          git add .
          git commit -m "Deploy Pages site for ${GITHUB_SHA}" || exit 0
          git push --force origin gh-pages
