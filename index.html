<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tap Survivor</title>
    <link rel="stylesheet" href="src/styles.css?v=auto-f23e804a" />
  </head>
  <body>
    <main class="shell">
      <section class="game-panel">
        <canvas id="game" width="960" height="540" aria-label="Tap Survivor game canvas"></canvas>
        <div class="speed-controls" aria-label="Game speed controls">
          <button class="speed-button active" type="button" data-speed="1">x1</button>
          <button class="speed-button" type="button" data-speed="2">x2</button>
          <button class="speed-button" type="button" data-speed="5">x5</button>
          <button id="muteAudio" class="speed-button mute-button" type="button" aria-pressed="false">Sound</button>
        </div>
        <button id="fullscreenButton" class="fullscreen-button" type="button">Full Screen</button>
        <button id="openMenu" class="menu-button" type="button" aria-expanded="false">Menu</button>
        <div id="questBanner" class="quest-banner hidden"></div>
        <div id="titleScreen" class="modal">
          <div class="modal-box start-box">
            <h2>Tap Survivor</h2>
            <div class="start-actions">
              <button id="titleStartGame" type="button">Start Game</button>
            </div>
          </div>
        </div>
        <div id="startTransition" class="modal hidden">
          <div class="modal-box start-box">
            <h2>Tap Survivor</h2>
            <p>Entering the tower...</p>
          </div>
        </div>
        <div id="shopModal" class="modal hidden">
          <div class="modal-box menu-box">
            <div class="modal-header">
              <h2>Coin Shop</h2>
              <button id="closeShop" class="modal-close" type="button" aria-label="Close shop">&times;</button>
            </div>
            <p id="shopCoinHud"></p>
            <p id="shopNotice" class="shop-notice"></p>
            <div id="shopItems" class="shop-grid"></div>
            <button id="closeShopBottom" type="button">Close Shop</button>
          </div>
        </div>
        <div id="runMenu" class="modal hidden">
          <div class="modal-box menu-box">
            <div class="modal-header">
              <h2>Run Menu</h2>
              <button id="closeMenu" class="modal-close" type="button" aria-label="Close run menu">&times;</button>
            </div>
            <div class="menu-tabs" role="tablist" aria-label="Run menu tabs">
              <button id="menuProgressTab" class="menu-tab active" type="button">Rewards</button>
              <button id="menuInventoryTab" class="menu-tab" type="button">Inventory</button>
              <button id="menuShopTab" class="menu-tab" type="button">Shop</button>
            </div>
            <div id="menuProgressPanel">
              <p>Spend Quest Points, unlock weapons, and review quests.</p>
              <h3>Progression Tree</h3>
              <p id="menuQpHud"></p>
              <div id="menuTree" class="tree"></div>
              <h3>Quests</h3>
              <div id="menuQuests" class="quests"></div>
            </div>
            <div id="menuInventoryPanel" class="hidden">
              <p id="menuRelicSlots"></p>
              <div id="menuRelicInventory" class="relic-grid"></div>
            </div>
            <div id="menuShopPanel" class="hidden">
              <p id="menuShopCoinHud"></p>
              <p id="menuShopNotice" class="shop-notice"></p>
              <div id="menuShopItems" class="shop-grid"></div>
            </div>
            <button id="exitRun" class="danger-button" type="button">Exit Run</button>
          </div>
        </div>
        <div id="levelUp" class="modal hidden">
          <div class="modal-box">
            <div class="modal-header">
              <h2>Level Up</h2>
              <button id="closeLevelUp" class="modal-close" type="button" aria-label="Close level up menu">&times;</button>
            </div>
            <p>Choose one upgrade.</p>
            <div id="choices" class="choice-list"></div>
          </div>
        </div>
        <div id="relicChoice" class="modal hidden">
          <div class="modal-box">
            <h2 id="relicChoiceTitle">Choose Relic</h2>
            <p id="relicChoiceText">Choose one relic.</p>
            <div id="relicChoices" class="choice-list"></div>
          </div>
        </div>
        <div id="endScreen" class="modal hidden">
          <div class="modal-box">
            <div class="modal-header">
              <h2>Run Complete</h2>
              <button id="closeEndX" class="modal-close" type="button" aria-label="Close end screen">&times;</button>
            </div>
            <div id="runStats" class="stats"></div>
            <button id="closeEnd">Return to Menu</button>
          </div>
        </div>
      </section>

    </main>
