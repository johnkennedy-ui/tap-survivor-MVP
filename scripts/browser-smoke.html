<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tap Survivor Browser Smoke</title>
  </head>
  <body>
    <pre id="result">SMOKE_BROWSER_RUNNING</pre>
    <script>
      const result = document.getElementById("result");
      const checks = [];
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function check(name, pass) {
        checks.push({ name, pass: Boolean(pass) });
      }

      function finish() {
        const failed = checks.filter((item) => !item.pass);
        result.textContent = [
          failed.length ? "SMOKE_BROWSER_FAIL" : "SMOKE_BROWSER_PASS",
          ...checks.map((item) => `${item.pass ? "PASS" : "FAIL"} ${item.name}`),
        ].join("\n");
      }

      async function run() {
        localStorage.setItem(
          "tap-survivor-mvp-save-v2",
          JSON.stringify({
            coins: 35,
            shopPurchases: {},
            unlockedWeapons: ["spark_bolt"],
          }),
        );

        const frame = document.createElement("iframe");
        frame.id = "app";
        frame.src = "/index.html?browser-smoke=1";
        frame.width = "960";
        frame.height = "720";
        document.body.appendChild(frame);
        await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
        await wait(250);

        const app = frame.contentDocument;
        check("app document loads", Boolean(app));
        check("canvas exists", Boolean(app.getElementById("game")));
        check("index chrome is absent", !app.querySelector("aside") && !app.getElementById("startRun") && !app.getElementById("runHud"));
        check("title screen exists", Boolean(app.getElementById("titleScreen")));
        check("title screen is visible first", !app.getElementById("titleScreen").classList.contains("hidden"));
        check("title screen shop button is absent", !app.getElementById("titleScreen").textContent.includes("Shop"));
        check("start menu exists", Boolean(app.getElementById("startMenu")));
        check("start menu waits behind title screen", app.getElementById("startMenu").classList.contains("hidden"));
        check("start menu shop button is absent", !app.getElementById("startMenuOpenShop"));
        check("fullscreen button exists", Boolean(app.getElementById("fullscreenButton")));

        app.getElementById("titleStartGame").click();
        await wait(50);
        check("start game hides title screen", app.getElementById("titleScreen").classList.contains("hidden"));
        check("start game shows transition first", !app.getElementById("startTransition").classList.contains("hidden"));
        check("start menu waits for transition", app.getElementById("startMenu").classList.contains("hidden"));
        await wait(500);
        check("transition hides after delay", app.getElementById("startTransition").classList.contains("hidden"));
        check("start game shows start menu", !app.getElementById("startMenu").classList.contains("hidden"));

        app.getElementById("openMenu").click();
        await wait(50);
        check("menu button opens menu", !app.getElementById("runMenu").classList.contains("hidden"));
        app.getElementById("openMenu").click();
        await wait(50);
        check("menu button closes menu", app.getElementById("runMenu").classList.contains("hidden"));

        app.getElementById("startMenuStartRun").click();
        await wait(100);
        check("start run creates game state", Boolean(frame.contentWindow.__tapSurvivorHarness?.getGame?.()?.running));
        check("start menu hides during run", app.getElementById("startMenu").classList.contains("hidden"));

        app.getElementById("openMenu").click();
        await wait(50);
        app.getElementById("exitRun").click();
        await wait(50);
        check("exit run opens end screen", !app.getElementById("endScreen").classList.contains("hidden"));

        const speedTwo = [...app.querySelectorAll("[data-speed]")].find((button) => button.dataset.speed === "2");
        speedTwo.click();
        await wait(50);
        check("speed control updates page state", app.body.dataset.gameSpeed === "2");

        finish();
      }

      run().catch((error) => {
        result.textContent = `SMOKE_BROWSER_FAIL\n${error.stack || error}`;
      });
    </script>
  </body>
</html>
