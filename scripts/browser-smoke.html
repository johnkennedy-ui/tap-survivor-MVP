<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tap Survivor Browser Smoke</title>
  </head>
  <body>
    <pre id="result">SMOKE_BROWSER_RUNNING</pre>
    <script id="smoke-browser-report" type="application/json"></script>
    <script>
      const result = document.getElementById("result");
      const reportElement = document.getElementById("smoke-browser-report");
      const checks = [];
      const readiness = {
        observedGameSpeed: "",
        ready: false,
        timedOut: false,
        timeoutMs: 4000,
      };
      const diagnostics = {
        pageErrors: [],
        resourceErrors: [],
        unhandledRejections: [],
      };
      const interactionChecks = [
        "start game hides title screen",
        "start game keeps legacy transition hidden",
        "menu button opens menu",
        "menu close control closes menu",
        "speed control updates page state",
        "exit run opens end screen",
        "end close returns to title",
      ];
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function check(name, pass) {
        checks.push({ name, pass: Boolean(pass) });
      }

      function describeError(error) {
        if (!error) return "";
        if (typeof error === "string") return error;
        return error.stack || error.message || String(error);
      }

      function recordPageError(scope, event) {
        diagnostics.pageErrors.push({
          column: Number(event.colno || 0),
          line: Number(event.lineno || 0),
          message: event.message || describeError(event.error),
          scope,
          source: event.filename || "",
        });
      }

      function recordResourceError(scope, event) {
        const target = event.target;
        diagnostics.resourceErrors.push({
          scope,
          tagName: target?.tagName || "unknown",
          url: target?.currentSrc || target?.src || target?.href || "",
        });
      }

      function recordUnhandledRejection(scope, event) {
        diagnostics.unhandledRejections.push({
          message: describeError(event.reason),
          scope,
        });
      }

      function installDiagnostics(scope, windowRef, documentRef) {
        windowRef?.addEventListener("error", (event) => {
          if (event.target === windowRef || event.error || event.message) {
            recordPageError(scope, event);
          }
        });
        windowRef?.addEventListener("unhandledrejection", (event) => recordUnhandledRejection(scope, event));
        documentRef?.addEventListener(
          "error",
          (event) => {
            if (event.target && event.target !== documentRef) recordResourceError(scope, event);
          },
          true,
        );
      }

      function markInteractionsNotRun() {
        interactionChecks.forEach((name) => {
          if (!checks.some((checkResult) => checkResult.name === name)) {
            checks.push({ name, pass: false, state: "not_run" });
          }
        });
      }

      function finish() {
        const diagnosticsPresent = Object.values(diagnostics).some((items) => items.length > 0);
        const passed =
          readiness.ready && !readiness.timedOut && checks.length > 0 && checks.every((item) => item.pass) && !diagnosticsPresent;
        const outcome = passed ? "pass" : "fail";
        reportElement.textContent = JSON.stringify({ outcome, checks, readiness, diagnostics });
        result.textContent = [
          outcome === "pass" ? "SMOKE_BROWSER_PASS" : "SMOKE_BROWSER_FAIL",
          ...checks.map((item) => `${item.pass ? "PASS" : "FAIL"} ${item.name}`),
        ].join("\n");
      }

      async function waitForProductionRuntime(app) {
        const deadline = Date.now() + readiness.timeoutMs;
        do {
          readiness.observedGameSpeed = app?.body?.dataset?.gameSpeed || "";
          if (readiness.observedGameSpeed === "1") {
            readiness.ready = true;
            return true;
          }
          await wait(25);
        } while (Date.now() < deadline);
        readiness.timedOut = true;
        return false;
      }

      async function run() {
        localStorage.setItem(
          "tap-survivor-mvp-save-v2",
          JSON.stringify({
            coins: 35,
            shopPurchases: {},
            unlockedWeapons: ["spark_bolt"],
          }),
        );

        const frame = document.createElement("iframe");
        frame.id = "app";
        frame.src = "/index.html?browser-smoke=1";
        frame.width = "960";
        frame.height = "720";
        frame.addEventListener("error", (event) => recordResourceError("fixture", event));
        document.body.appendChild(frame);
        await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));

        const app = frame.contentDocument;
        installDiagnostics("app", frame.contentWindow, app);
        await wait(250);

        const getAppElement = (id) => app?.getElementById(id);
        const titleScreen = getAppElement("titleScreen");
        check("app document loads", Boolean(app));
        check("canvas exists", Boolean(getAppElement("game")));
        check(
          "index chrome is absent",
          Boolean(app && !app.querySelector("aside") && !getAppElement("startRun") && !getAppElement("runHud")),
        );
        check("title screen exists", Boolean(titleScreen));
        check("title screen is visible first", Boolean(titleScreen && !titleScreen.classList.contains("hidden")));
        check("title screen shop button is absent", Boolean(titleScreen && !titleScreen.textContent.includes("Shop")));
        check("intermediate start menu is absent", !getAppElement("startMenu"));
        check("start menu shop button is absent", !getAppElement("startMenuOpenShop"));
        check("fullscreen button exists", Boolean(getAppElement("fullscreenButton")));

        const runtimeReady = await waitForProductionRuntime(app);
        check("production runtime readiness", runtimeReady);
        if (!runtimeReady || checks.some((item) => !item.pass)) {
          markInteractionsNotRun();
          finish();
          return;
        }

        getAppElement("titleStartGame").click();
        await wait(50);
        check("start game hides title screen", getAppElement("titleScreen").classList.contains("hidden"));
        check(
          "start game keeps legacy transition hidden",
          getAppElement("startTransition").classList.contains("hidden"),
        );

        getAppElement("openMenu").click();
        await wait(50);
        check("menu button opens menu", !getAppElement("runMenu").classList.contains("hidden"));
        getAppElement("closeMenu").click();
        await wait(50);
        check("menu close control closes menu", getAppElement("runMenu").classList.contains("hidden"));

        const speedTwo = [...app.querySelectorAll("[data-speed]")].find((button) => button.dataset.speed === "2");
        speedTwo.click();
        await wait(50);
        check("speed control updates page state", app.body.dataset.gameSpeed === "2");

        getAppElement("openMenu").click();
        await wait(50);
        getAppElement("exitRun").click();
        await wait(50);
        check("exit run opens end screen", !getAppElement("endScreen").classList.contains("hidden"));
        getAppElement("closeEnd").click();
        await wait(50);
        check("end close returns to title", !getAppElement("titleScreen").classList.contains("hidden"));

        finish();
      }

      run().catch((error) => {
        diagnostics.pageErrors.push({
          message: describeError(error),
          scope: "fixture",
        });
        markInteractionsNotRun();
        finish();
      });

      installDiagnostics("fixture", window, document);
    </script>
  </body>
</html>
